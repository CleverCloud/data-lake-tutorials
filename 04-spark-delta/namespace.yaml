apiVersion: v1
kind: Namespace
metadata:
  name: delta
---
# The Spark driver runs in client mode and creates its executor pods itself, so it runs under a service
# account allowed to manage pods in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: delta
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: delta
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: delta
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: delta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
