apiVersion: v1
kind: Namespace
metadata:
  name: batch
---
# The catalogue runs apart from the Jobs: a Job can create pods in its own namespace, and so read
# that namespace's secrets. Lakekeeper's secrets stay out of reach in this one.
apiVersion: v1
kind: Namespace
metadata:
  name: catalog
---
# The Spark driver runs in client mode and creates its executor pods itself, so it runs under a service
# account allowed to manage pods in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: batch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: batch
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: batch
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: batch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
